{% extends "biblioteca/base.html" %}

{% block content %}
<h1 class="mb-3">Registrar devolución</h1>
<div class="card card-body">
    <p><strong>Alumno:</strong> {{ prestamo.alumno }}</p>
    <p><strong>Libro:</strong> {{ prestamo.libro }}</p>
    <p><strong>Estado actual:</strong> {{ prestamo.estado }}</p>

    <form method="post">
        {% csrf_token %}
        <button class="btn btn-success" type="submit">Confirmar devolución</button>
        <a class="btn btn-secondary" href="{% url 'biblioteca:listar_prestamos' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
