<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca Universitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'biblioteca:listar_libros' %}">Biblioteca</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'biblioteca:listar_libros' %}">Libros</a>
            <a class="nav-link" href="{% url 'biblioteca:listar_alumnos' %}">Alumnos</a>
            <a class="nav-link" href="{% url 'biblioteca:listar_prestamos' %}">Préstamos</a>
            <a class="nav-link" href="{% url 'biblioteca:carga_masiva' %}">Carga Masiva</a>
            <a class="nav-link" href="{% url 'biblioteca:estadisticas' %}">Estadísticas</a>
        </div>
    </div>
</nav>

<main class="container">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
            {{ message }}
        </div>
    {% endfor %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
