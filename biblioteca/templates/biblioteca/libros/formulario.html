{% extends "biblioteca/base.html" %}

{% block content %}
<h1 class="mb-3">Registrar libro</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-secondary" href="{% url 'biblioteca:listar_libros' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
